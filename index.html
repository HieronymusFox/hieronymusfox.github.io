<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hieronymus Fox</title>
<meta name="description" content="Small, original arcade games with the feel of the classics and the polish of today.">
<style>
  :root { --cream:#f7f4ee; --line:#2b4464; --navy:#0b1d35; --navy-2:#09253f; --blue:#395887; --blue-2:#4b7791; --soft:#c9d1df; --accent:#9fc0d3;
    --display:Impact,"Arial Narrow Bold","Helvetica Neue Condensed Bold","Roboto Condensed",sans-serif;
    --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; min-height:100%; display:flex; flex-direction:column; background:radial-gradient(circle at 50% 28%,#1b3c66 0,var(--navy-2) 42%,var(--navy) 78%); color:var(--cream); font-family:var(--body); font-size:17px; line-height:1.6; }
  body::before { content:""; display:block; height:6px; flex:none; background:linear-gradient(90deg,var(--blue),var(--blue-2)); }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:48px 16px; text-align:center; }
  .inner { width:100%; max-width:40rem; }
  .mark { width:min(100%,470px); margin:0 auto 28px; padding:clamp(16px,4vw,26px) clamp(18px,5vw,34px); background:var(--cream); border-radius:18px; box-shadow:0 24px 60px rgba(0,0,0,.42); }
  .mark svg { display:block; width:100%; height:auto; }
  h1 { margin:0; font-family:var(--display); font-weight:400; font-size:clamp(42px,10vw,76px); line-height:1.04; letter-spacing:.04em; text-transform:uppercase; }
  .tag { margin:10px 0 16px; font-family:var(--display); font-size:clamp(19px,3.6vw,27px); letter-spacing:.07em; text-transform:uppercase; color:var(--accent); }
  .lead { max-width:31em; margin:0 auto 28px; color:#dfe4ec; font-size:18px; }
  .btn { display:inline-block; padding:13px 24px; border-radius:8px; background:var(--cream); color:var(--navy); font-weight:700; font-size:16px; text-decoration:none; overflow-wrap:anywhere; transition:transform .12s ease,background .12s ease; }
  .btn:hover { background:#fff; transform:translateY(-2px); }
  a:focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:6px; }
  footer { flex:none; border-top:1px solid var(--line); padding:18px 16px 22px; color:var(--soft); font-size:14px; }
  footer .row { max-width:50rem; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 22px; }
  footer nav { display:flex; flex-wrap:wrap; gap:6px 20px; }
  footer a { color:var(--soft); text-decoration:none; overflow-wrap:anywhere; }
  footer a:hover { color:#fff; text-decoration:underline; }
  @media (prefers-reduced-motion:reduce) { .btn { transition:none; } .btn:hover { transform:none; } }
</style>
